<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    style-src 'self' 'unsafe-inline';
    script-src 'self' 'unsafe-eval';
    img-src 'self' data: https: http:;
    font-src 'self' data:;
    connect-src 'self';
  ">
  <title>Markdown Viewer</title>
  <link rel="stylesheet" href="styles.css">

  <!-- ─── JS Libraries (本地 vendor) ────────────────────────────────── -->
  <script src="vendor/markdown-it.min.js"></script>
  <script src="vendor/markdown-it-emoji.min.js"></script>
  <script src="vendor/markdown-it-sub.min.js"></script>
  <script src="vendor/markdown-it-sup.min.js"></script>
  <script src="vendor/markdown-it-mark.min.js"></script>
  <script src="vendor/markdown-it-footnote.min.js"></script>
  <script src="vendor/markdown-it-task-lists.min.js"></script>
  <script src="vendor/markdown-it-container.min.js"></script>
  <script src="vendor/highlight.min.js"></script>
  <script src="vendor/mermaid.min.js"></script>
  <script src="vendor/echarts.min.js"></script>

  <!-- QWebChannel (本地文件 — PyQt6 不自带此资源) -->
  <script src="vendor/qwebchannel.js"></script>

  <!-- KaTeX 数学公式 -->
  <link rel="stylesheet" href="vendor/katex.min.css">
  <script src="vendor/katex.min.js"></script>
  <script src="vendor/katex-auto-render.min.js"></script>
</head>
<body>
  <div id="app">
    <div id="main-layout">
      <!-- Content -->
      <main id="content">
        <div id="drop-overlay">
          <div class="drop-message">
            <div class="drop-icon">📄</div>
            <p class="drop-title">拖放 Markdown 文件到这里</p>
            <p class="drop-sub">或点击菜单栏 📂 按钮 / 按 <kbd>Ctrl+O</kbd> 打开</p>
          </div>
        </div>
        <article id="preview" class="markdown-body"></article>
        <div id="loading-indicator" class="loading hidden">
          <div class="spinner"></div>
          <span>渲染中…</span>
        </div>
      </main>

      <!-- TOC (WebView 内部侧边栏) -->
      <div id="toc-sidebar" class="toc-sidebar" style="display:none">
        <div class="toc-header">📑 目录</div>
        <div id="toc-content" class="toc-scroll"></div>
      </div>
    </div>

    <!-- Search bar -->
    <div id="search-bar" class="search-bar" style="display:none">
      <input type="text" id="search-input" placeholder="搜索文档…" spellcheck="false">
      <span id="search-count" class="search-count"></span>
      <button class="tool-btn small" id="btn-search-prev">▲</button>
      <button class="tool-btn small" id="btn-search-next">▼</button>
      <button class="tool-btn small" id="btn-search-close">✕</button>
    </div>
  </div>

  <!-- App Script -->
  <script src="pure-utils.js"></script>
  <script src="app.js"></script>
</body>
</html>
